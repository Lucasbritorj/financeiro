# CI: os mesmos gates rodados localmente (npm test / test:sql / tsc / lint /
# build). Ativa automaticamente quando o repositório ganhar remote GitHub.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  node:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    env:
      # Build não conecta no Supabase; placeholders satisfazem o createClient.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      # As versões destas duas são cobradas por tests/unit/gate-ci-acoes.test.ts:
      # major abaixo do primeiro com runtime Node 24 é teste vermelho, não
      # annotation silenciosa no run verde.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # O npm que acompanha o node flutua: `node-version: 24` trouxe 11.6.x em
      # julho e 11.17.0 em agosto. Isso não é detalhe — em 13/08/2026 o
      # package-lock.json foi reparado com npm 11.6.2, saiu verde na máquina de
      # quem reparou e continuou vermelho aqui, porque o 11.17.0 exige entradas
      # de topo para bundleDependencies que o 11.6.2 dispensa. Quem valida o
      # lock precisa ser sempre a mesma versão, senão "npm ci verde" não
      # responde "verde em qual npm?". A versão vive em packageManager, no
      # package.json, para que o desenvolvedor local use a mesma.
      - name: pin do npm declarado em packageManager
        run: |
          NPM_PIN=$(node -p "require('./package.json').packageManager.replace('npm@','')")
          echo "pin declarado no package.json: $NPM_PIN"
          npm i -g npm@$NPM_PIN
          npm --version
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run test:componentes
      - run: npm run build

  e2e:
    name: navegador · axe · teclado · 320+768+1024+1440
    runs-on: ubuntu-latest
    env:
      # Só rotas públicas: o build não conecta no Supabase, placeholders bastam.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: pin do npm declarado em packageManager
        run: |
          NPM_PIN=$(node -p "require('./package.json').packageManager.replace('npm@','')")
          npm i -g npm@$NPM_PIN
      - run: npm ci
      # `--with-deps` instala as libs de sistema do Chromium no runner; sem
      # elas o browser baixa e não abre, e o erro aparece só no primeiro teste.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Sem `npm run test:e2e`: aquele script refaz o build. Aqui o build já
      # rodou no step acima e serve de gate próprio.
      - run: npx playwright test
      - name: upload do relatório quando falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: lighthouse · performance + a11y na página real
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: pin do npm declarado em packageManager
        run: |
          NPM_PIN=$(node -p "require('./package.json').packageManager.replace('npm@','')")
          npm i -g npm@$NPM_PIN
      - run: npm ci
      - run: npm run build
      # lhci sobe o `next start` sozinho (startServerCommand no lighthouserc.json),
      # roda 3 vezes e aplica os limiares. Job separado do e2e porque compete por
      # CPU com o Playwright: medir performance junto de outra suíte dá ruído.
      - run: npm run test:lighthouse
      - name: upload dos relatórios quando falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  sql:
    name: migrações + asserts em Postgres real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: app
    steps:
      - uses: actions/checkout@v6
      - name: shim + migrações em ordem
        run: |
          psql -v ON_ERROR_STOP=1 -q -f tests/sql/00_shim_auth.sql
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: asserts (todos os arquivos de supabase/tests)
        run: PSQL_CMD="psql -v ON_ERROR_STOP=1" bash tests/sql/run_asserts.sh
